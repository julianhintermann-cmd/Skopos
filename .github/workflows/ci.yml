name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD"
          fi
          bash scripts/check-commits.sh "$range"

  go:
    name: Go build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned so a new linter release cannot turn an unrelated PR red,
          # and so contributors get the same result locally. Bump deliberately.
          version: v2.12.2
      - name: Build
        run: make go-build
      - name: Test
        run: go test ./...
      - name: Integration tests (nftables in a netns)
        run: sudo -E $(which go) test -tags=integration -run Integration ./internal/firewall/...
      - name: Generated files are up to date
        run: |
          go generate ./...
          git diff --exit-code -- deploy/config.schema.json docs/configuration.md

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build (single-arch, no push) on every push and PR. The release
      # workflow only runs on main and tags, so without this probe a broken
      # Dockerfile — a stale base image against the go.mod toolchain, say —
      # would not surface until release time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        # Explicit, because `tsc --noEmit` here would prove nothing:
        # tsconfig.json is a solution file with "files": [], so it checks the
        # empty list and exits 0. `tsc -b` follows the project references.
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
