name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD"
          fi
          bash scripts/check-commits.sh "$range"

  go:
    name: Go build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Build
        run: make go-build
      - name: Test
        run: go test ./...
      - name: Generated files are up to date
        run: |
          go generate ./...
          git diff --exit-code -- deploy/config.schema.json docs/configuration.md

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build (includes type-check)
        working-directory: web
        run: npm run build
