openapi: 3.1.0
info:
  title: Skopos API
  description: >
    Traffic monitoring, firewall management and alerting for a self-hosted NAS.
    The YAML configuration file is the source of truth for rules and thresholds;
    this API exposes runtime state (flows, alerts, blocks, devices) and the
    actions the dashboard performs.
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
security:
  - sessionCookie: []
  - bearerToken: []
paths:
  /api/health:
    get:
      summary: Liveness and subsystem health
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Degraded }
  /api/auth/login:
    post:
      summary: Authenticate and receive a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: Logged in; sets the skopos_session cookie }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts (backoff) }
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      security: []
      responses:
        "200": { description: Logged out }
  /api/me:
    get:
      summary: Current identity and enforcement state
      responses:
        "200": { description: Identity }
  /api/overview:
    get:
      summary: Dashboard overview tiles
      responses:
        "200": { description: Live stats, throughput, top talkers, counts }
  /api/stream:
    get:
      summary: Server-sent event stream of live metrics and events
      description: >
        text/event-stream. Named events: `live` (throughput snapshot, once a
        second), `flows` (a batch of completed flows, once per flush).
      responses:
        "200": { description: text/event-stream }
  /api/flows:
    get:
      summary: Traffic time series and top talkers for a range
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: resolution, in: query, schema: { type: string, enum: [1m, 1h, 1d] } }
      responses:
        "200": { description: Series and talkers }
  /api/live/flows:
    get:
      summary: Most recent completed flows, for the live view's initial fill
      description: >
        Returns the retained ring of recently completed flows, newest first.
        Live updates then arrive as `flows` events on /api/stream.
      responses:
        "200": { description: Recent flows }
  /api/devices:
    get:
      summary: LAN device inventory
      responses:
        "200": { description: Devices }
  /api/devices/{mac}/detail:
    get:
      summary: One device's inventory record plus its traffic over a window
      description: >
        Returns the device, a throughput series, top destinations (with DNS/SNI
        names where captured) and destination ports, keyed by the device's
        current IP. Window defaults to 24h.
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, description: "duration like 24h / 168h" } }
      responses:
        "200": { description: Device detail }
        "404": { description: No device with that mac }
  /api/devices/{mac}/presence:
    post:
      summary: Toggle arrive/leave notifications for a device
      description: >
        When enabled, Skopos notifies (and records an info alert) when the
        device appears on the network or falls silent for 10+ minutes. The
        current state is seeded from the device's last sighting, so enabling
        never fires an immediate notification. Requires write scope.
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watch: { type: boolean }
      responses:
        "200": { description: Updated }
        "404": { description: No device with that mac }
  /api/devices/{mac}/wake:
    post:
      summary: Send a Wake-on-LAN magic packet for the MAC
      description: >
        Broadcasts the magic packet on UDP port 9. Fire-and-forget — whether
        the machine wakes depends on its NIC/BIOS settings. Requires write
        scope; the action is audited.
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Packet sent }
        "400": { description: Invalid MAC }
  /api/export/flows.csv:
    get:
      summary: Raw flows of a time range as CSV
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200000 } }
      responses:
        "200": { description: "text/csv attachment (default: last 24h, 50k rows)" }
  /api/export/devices.csv:
    get:
      summary: Device inventory as CSV
      responses:
        "200": { description: text/csv attachment }
  /api/export/alerts.csv:
    get:
      summary: Alert history as CSV
      responses:
        "200": { description: text/csv attachment }
  /api/devices/{mac}/label:
    post:
      summary: Set or clear a device's operator-assigned name
      description: >
        The label is set only through this endpoint and is never overwritten by
        auto-discovery; it takes precedence over the discovered hostname. An
        empty label clears it. Requires write scope.
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 64 }
      responses:
        "200": { description: Label updated }
        "400": { description: Missing mac or label too long }
        "404": { description: No device with that mac }
  /api/alerts:
    get:
      summary: Alert history
      parameters:
        - { name: unacked, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Alerts }
  /api/alerts/{id}/ack:
    post:
      summary: Acknowledge an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Acknowledged }
  /api/blocks:
    get:
      summary: Active firewall blocks
      responses:
        "200": { description: Blocks }
    post:
      summary: Block an IP or CIDR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string, description: "IP or CIDR, e.g. 203.0.113.5 or 203.0.113.0/24" }
                reason: { type: string }
                ttl: { type: string, description: "duration like 24h; omit for permanent" }
      responses:
        "201": { description: Block created }
        "400": { description: Invalid prefix or ttl }
    delete:
      summary: Remove a block
      parameters:
        - { name: prefix, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed }
        "404": { description: No active block for that prefix }
  /api/rules:
    get:
      summary: Effective detection and firewall configuration (read-only)
      responses:
        "200": { description: Rules }
  /api/audit:
    get:
      summary: Audit log
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Audit entries }
  /api/config/validate:
    post:
      summary: Validate a candidate config.yaml without applying it
      requestBody:
        required: true
        content:
          text/plain: { schema: { type: string } }
      responses:
        "200": { description: "{valid:true} or {valid:false, error:...}" }
  /api/notify/test:
    post:
      summary: Send a test notification to configured channels
      responses:
        "200": { description: "{ok:true} or {ok:false, error:...}" }
  /api/integrations/cloudflare:
    get:
      summary: Cloudflare connection status and connected zones
      description: Never returns the API token. Reports connected state, token id and the zone list with monitored flags.
      responses:
        "200": { description: Status }
    post:
      summary: Connect Cloudflare with a scoped API token
      description: >
        The token is verified, then sealed with AES-GCM and stored; it is never
        written to config or returned. Requires write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "Cloudflare API token with Zone Read + Analytics Read" }
      responses:
        "200": { description: Connected; returns status }
        "400": { description: Missing token }
        "502": { description: Token rejected or Cloudflare unreachable }
    delete:
      summary: Disconnect Cloudflare and wipe the stored token and zones
      responses:
        "200": { description: Disconnected }
  /api/integrations/cloudflare/zones/{id}:
    post:
      summary: Toggle whether a zone's traffic is monitored
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monitored: { type: boolean }
      responses:
        "200": { description: Updated }
        "404": { description: Unknown zone }
  /api/integrations/cloudflare/analytics:
    get:
      summary: Per-hour request traffic for a connected zone
      parameters:
        - { name: zone, in: query, required: true, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, description: "duration like 24h or 168h; default 24h" } }
      responses:
        "200": { description: Analytics series }
        "400": { description: Missing zone }
        "502": { description: Cloudflare error (e.g. token lacks Analytics Read) }
  /api/speedtest:
    get:
      summary: Internet speed measurement history (newest 100)
      responses:
        "200": { description: Results }
  /api/speedtest/run:
    post:
      summary: Run a speed measurement now
      description: Synchronous; a real test moves tens of megabytes and takes up to a minute. Requires write scope.
      responses:
        "200": { description: The new measurement }
        "502": { description: Measurement failed }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skopos_session
    bearerToken:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      properties:
        ok: { type: boolean }
        version: { type: string }
        capture: { type: string }
        firewall: { type: string }
        enforcing: { type: boolean }
        cold_storage_ok: { type: boolean }
