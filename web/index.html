<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Traffic monitoring, firewall management and alerting for your NAS." />
    <!-- SVG first for crisp scaling; the PNG covers browsers without SVG icon
         support. Both use the small-size mark, which stays legible in a tab. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Two entries, not one. A single hardcoded dark canvas was wrong half the
         time once 'system' became the default theme. ThemeProvider rewrites
         both once it has resolved an explicit user choice. -->
    <meta name="theme-color" content="#f1f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)" />
    <title>Skopos</title>
    <!-- Resolve the theme before first paint. React mounts too late: with
         'system' as the default, the document would paint #f1f5f4 and then
         repaint #0b100f a frame later — a measured white flash on every load
         for dark-OS users. Must stay ahead of the module script. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('skopos-theme') || 'system'
          var r = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t
          document.documentElement.setAttribute('data-theme', r)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
