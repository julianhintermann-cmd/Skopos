<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Skopos">
  <title>Skopos</title>
  <!--
    Small-size variant, for the browser tab and anywhere below ~48px. The full
    mark loses its rings at 16px and collapses into a dark blob, so this one
    drops the outer ring and the sweep, thickens the strokes and enlarges the
    contact until the shape still reads at a glance.
  -->
  <rect width="512" height="512" rx="104" fill="#0e1816"/>

  <g fill="none" stroke="#54ccbc" stroke-linecap="round">
    <circle cx="248" cy="264" r="150" stroke-width="26" opacity="0.55"/>
    <circle cx="248" cy="264" r="78"  stroke-width="26"/>
  </g>

  <!-- Contact, cut clear of the outer ring by a ring of background so the two
       never merge into one mass at small sizes -->
  <circle cx="366" cy="150" r="86" fill="#0e1816"/>
  <circle cx="366" cy="150" r="58" fill="#8ce9db"/>

  <circle cx="248" cy="264" r="30" fill="#54ccbc"/>
</svg>
